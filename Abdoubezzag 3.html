<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع متوقف</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #111827;
            border: 2px solid #ef4444;
            padding: 40px 25px;
            border-radius: 20px;
            max-width: 550px;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.25);
        }
        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }
        h1 {
            color: #ef4444;
            font-size: 26px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .message {
            color: #e2e8f0;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 25px;
            background: #1f2937;
            padding: 20px;
            border-radius: 12px;
            border-right: 4px solid #ef4444;
            text-align: right;
        }
        .badge {
            display: inline-block;
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚫</div>
        <h1>تم إيقاف تشغيل الموقع</h1>
        
        <div class="message">
            من الـ 4 تاع الصباح وأنا نطور ونخدم في هذا المتجر، قدمت كاع واش عندي ودرت كاع واش عليا باش يعجبك ويطلع محترف... وفي الأخير ماشفتش حقي وماكنتيش في كلمتك.
        </div>

        <div class="badge">Payment Pending / الخدمة متوقفة بسبب عدم الدفع</div>
    </div>
</body>
</html>
